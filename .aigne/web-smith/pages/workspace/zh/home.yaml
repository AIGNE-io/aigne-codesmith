"meta":
  "title": "AIGNE CodeSmith：AI 驱动的代码审查与 PR 摘要"
  "description": "使用 AIGNE CodeSmith 加速您的开发工作流。获取由 Claude 先进推理能力驱动的智能、上下文感知代码审查和 PR 摘要，以提高代码质量并节省时间。"
  "image": "mediakit://hero-aigne-codesmith-visual.png"
"sections":
  - "sectionName": "hero"
    "sectionSummary": "此英雄部分通过引人注目的标题、价值主张的简要说明以及清晰的行动号召来介绍 AIGNE CodeSmith，旨在吸引访问者的注意力并鼓励他们探索产品。"
    "splitHeroBigTitle": "真正理解您代码的 AI 代码审查"
    "splitHeroSubTitle": "利用 Claude 先进的推理能力，通过智能、上下文感知的代码审查加速您的开发工作流。"
    "splitHeroDescription": "彻底改变您的代码审查流程。AIGNE CodeSmith 不仅仅是检查语法——它能理解上下文、识别架构问题，并提供有助于团队成长的深刻反馈。"
    "splitHeroActions":
      - "text": "在 GitHub 上开始使用"
        "link": "https://github.com/aigne-io/aigne-codesmith"
      - "text": "探索功能"
        "link": "#features"
    "splitHeroImage": "mediakit://hero-aigne-codesmith-visual.png"
  - "sectionName": "features"
    "sectionSummary": "本节重点介绍 AIGNE CodeSmith 的核心功能，通过一个视觉上引人入胜的三列网格展示其主要能力。每个功能都配有图标和简短描述，方便用户快速了解产品优势。"
    "threeColumnGridTitle": "智能代码审查所需的一切"
    "list":
      - "sectionName": "prSummarization"
        "sectionSummary": "详细介绍 PR 摘要功能。"
        "iconName": "lucide:file-text"
        "cardTitle": "PR 摘要"
        "cardDescription": "自动生成简洁的摘要和发布说明，让您一目了然地了解变更，节省宝贵时间。"
      - "sectionName": "lineByLineReviews"
        "sectionSummary": "详细介绍逐行审查功能。"
        "iconName": "lucide:search-code"
        "cardTitle": "逐行审查"
        "cardDescription": "在关键之处获得代码改进的上下文建议，帮助您在问题进入生产环境之前将其捕获。"
      - "sectionName": "costOptimization"
        "sectionSummary": "详细介绍成本优化功能。"
        "iconName": "lucide:dollar-sign"
        "cardTitle": "成本优化"
        "cardDescription": "增量审查仅跟踪已更改的文件，最大限度地减少 API 成本，同时最大化您的代码覆盖率。内置高效！"
      - "sectionName": "smartAnalysis"
        "sectionSummary": "详细介绍智能分析功能。"
        "iconName": "lucide:brain-circuit"
        "cardTitle": "智能分析"
        "cardDescription": "利用 Claude-3.5-Sonnet 的强大功能进行卓越推理，为您提供深刻的架构见解，而不仅仅是简单的语法检查。"
      - "sectionName": "intelligentSkipping"
        "sectionSummary": "详细介绍智能跳过功能。"
        "iconName": "lucide:fast-forward"
        "cardTitle": "智能跳过"
        "cardDescription": "我们的 AI 足够智能，可以忽略拼写错误和格式化等琐碎更改，让您的审查人员专注于真正重要的事情。"
      - "sectionName": "customPrompts"
        "sectionSummary": "详细介绍自定义提示功能。"
        "iconName": "lucide:settings-2"
        "cardTitle": "自定义提示"
        "cardDescription": "完全可定制的审查标准和语气。轻松使 AI 适应您团队独特的标准和实践。"
  - "sectionName": "quickStart"
    "sectionSummary": "本节提供了一个简单、分步的 AIGNE CodeSmith 入门指南。它将整个过程分解为三个简单的操作，并配有代码片段和视觉效果，以确保无缝的设置体验。"
    "oneColumnGridTitle": "不到 2 分钟即可启动并运行"
    "list":
      - "sectionName": "addWorkflow"
        "sectionSummary": "快速入门指南的第一步，添加 GitHub 工作流文件。"
        "contentCardTitle": "第 1 步：添加工作流"
        "contentCardDescription": "只需向您的仓库添加一个文件！在 `.github/workflows/aigne-codesmith.yml` 处创建一个新文件，并粘贴以下配置。就是这么简单！"
        "contentCardRightCode":
          "name": "aigne-codesmith.yml"
          "content": "name: 🤖 AI 代码审查


            permissions:

            \  contents: read

            \  pull-requests: write


            on:

            \  pull_request:

            \  pull_request_review_comment:

            \    types: [created]


            concurrency:

            \  group:

            \    ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}-${{ github.event_name == 'pull_request_review_comment' && 'pr_comment' || 'pr' }}

            \  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}


            jobs:

            \  review:

            \    runs-on: ubuntu-latest

            \    steps:

            \      - uses: aigne-io/aigne-codesmith@latest

            \        env:

            \          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            \          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

            \        with:

            \          debug: false

            \          review_simple_changes: false

            \          review_comment_lgtm: false"
      - "sectionName": "configureSecrets"
        "sectionSummary": "快速入门指南的第二步，在 GitHub 中配置 API 密钥。"
        "contentCardTitle": "第 2 步：配置密钥"
        "contentCardDescription": "是时候保护您的 API 密钥了。前往您仓库的“Settings > Secrets and variables > Actions”。点击“New repository secret”，将其命名为 `ANTHROPIC_API_KEY`，并粘贴您从 Anthropic 控制台获取的密钥。"
        "contentCardLeftScreenShot": "mediakit://github-action-secret.png"
        "screenShotBackground": "linear-gradient(120deg, rgba(96,89,171,1) 0%, rgba(130,125,190,1) 100%)"
      - "sectionName": "startReviewing"
        "sectionSummary": "快速入门指南的最后一步，确认设置已完成。"
        "contentCardTitle": "第 3 步：一切就绪！🎉"
        "contentCardDescription": "就是这样！创建一个新的拉取请求，见证奇迹的发生。AIGNE CodeSmith 将自动介入，提供智能、有用的审查。编码愉快！"
        "contentCardRightScreenShot": "mediakit://pr-review-comment.png"
        "screenShotBackground": "linear-gradient(120deg, rgba(95,116,118,1) 0%, rgba(131,158,153,1) 100%)"
