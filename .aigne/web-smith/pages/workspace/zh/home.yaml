  - "sectionName": "configuration"
    "sectionSummary": "本节详细介绍 AIGNE CodeSmith 中可用的各种配置选项，从基本参数到高级自定义提示。它使用户能够根据自己的特定需求定制工具，展示其灵活性和强大功能。"
    "oneColumnGridTitle": "完全可定制以适应您的工作流"
    "list":
      - "sectionName": "securityFocusedReviews"
        "sectionSummary": "针对安全审查的配置示例。"
        "contentCardTitle": "注重安全的审查"
        "contentCardDescription": "定制 AI 的特性以优先考虑安全性。通过自定义系统消息，您可以指示它专注于识别认证缺陷、输入验证问题、SQL 注入漏洞等。"
        "contentCardBottomCode":
          "name": "action.yml"
          "content": "system_message: |

            \  您是一名注重安全的代码审查员。请优先识别：

            \  - 认证和授权缺陷

            \  - 输入验证问题

            \  - SQL 注入漏洞

            \  - XSS 预防

            \  - 数据暴露风险

            \  - 加密最佳实践"
      - "sectionName": "architecturePerformanceReviews"
        "sectionSummary": "针对架构和性能审查的配置示例。"
        "contentCardTitle": "架构与性能审查"
        "contentCardDescription": "将焦点转移到高层架构问题上。自定义提示，让 AI 分析系统设计模式、性能瓶颈、可扩展性和代码可维护性，确保您的代码库经久耐用。"
        "contentCardBottomCode":
          "name": "action.yml"
          "content": "system_message: |

            \  您是一名专注于架构的审查员，重点关注：

            \  - 系统设计模式

            \  - 性能瓶颈

            \  - 可扩展性问题

            \  - 代码可维护性

            \  - SOLID 原则

            \  - 数据库优化"
  - "sectionName": "support"
    "sectionSummary": "此常见问题解答部分回答了有关获取帮助、报告错误和请求功能的常见问题。它确保用户有清晰的途径获得支持和参与社区，营造积极协作的环境。"
    "faqTitle": "支持与社区"
    "faqList":
      - "question": "我在哪里可以找到详细的文档？"
        "answer": "您可以查看我们的 Wiki，获取关于每个功能和配置选项的详细指南和全面文档。"
      - "question": "我如何报告错误？"
        "answer": "发现问题了吗？我们很乐意倾听！请在我们的 GitHub 仓库中提交一个 issue，并提供详细的复现步骤，以便我们修复。"
      - "question": "我有一个很棒的新功能想法。我可以在哪里提出建议？"
        "answer": "我们洗耳恭听！您可以通过在我们的 GitHub 上创建一个功能请求 issue 来建议改进和新功能。让我们一起构建出色的产品！"
      - "question": "有可以与社区讨论项目的地方吗？"
        "answer": "当然有！加入我们的 GitHub Discussions 提问、分享想法，并与其他 AIGNE CodeSmith 用户和贡献者建立联系。"
  - "sectionName": "finalCta"
    "sectionSummary": "这最后一个行动号召部分旨在将访问者转化为用户。它呈现了清晰、引人注目的信息和突出的按钮，鼓励他们采取下一步，将 AIGNE CodeSmith 集成到他们的工作流程中。"
    "ctaTitle": "准备好为您的代码审查增效了吗？"
    "ctaDescription": "不要再浪费时间进行手动审查，让我们的 AI 来处理繁重的工作。立即开始，体验更快、更智能、更高效的开发工作流。"
    "cta":
      - "text": "在 GitHub 上开始使用"
        "link": "https://github.com/aigne-io/aigne-codesmith"
      - "text": ""
        "link": ""