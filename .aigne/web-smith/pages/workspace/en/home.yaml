  - "sectionName": "configuration"
    "sectionSummary": "This section details the various configuration options available in AIGNE CodeSmith, from basic parameters to advanced custom prompts. It empowers users to tailor the tool to their specific needs, showcasing its flexibility and power."
    "oneColumnGridTitle": "Fully Customizable to Fit Your Workflow"
    "list":
      - "sectionName": "securityFocusedReviews"
        "sectionSummary": "Configuration example for security-focused reviews."
        "contentCardTitle": "Security-Focused Reviews"
        "contentCardDescription": "Tailor the AI's personality to prioritize security. With a custom system message, you can direct it to focus on identifying authentication flaws, input validation issues, SQL injection vulnerabilities, and more."
        "contentCardBottomCode":
          "name": "action.yml"
          "content": "system_message: |

            \  You are a security-focused code reviewer. Prioritize identifying:

            \  - Authentication and authorization flaws

            \  - Input validation issues

            \  - SQL injection vulnerabilities

            \  - XSS prevention

            \  - Data exposure risks

            \  - Cryptographic best practices"
      - "sectionName": "architecturePerformanceReviews"
        "sectionSummary": "Configuration example for architecture and performance reviews."
        "contentCardTitle": "Architecture & Performance Reviews"
        "contentCardDescription": "Shift the focus to high-level architectural concerns. Customize the prompt to have the AI analyze system design patterns, performance bottlenecks, scalability, and code maintainability, ensuring your codebase is built to last."
        "contentCardBottomCode":
          "name": "action.yml"
          "content": "system_message: |

            \  You are an architectural reviewer focusing on:

            \  - System design patterns

            \  - Performance bottlenecks

            \  - Scalability concerns

            \  - Code maintainability

            \  - SOLID principles

            \  - Database optimization"
  - "sectionName": "support"
    "sectionSummary": "This FAQ section provides answers to common questions about getting help, reporting bugs, and requesting features. It ensures users have a clear path to support and community engagement, fostering a positive and collaborative environment."
    "faqTitle": "Support & Community"
    "faqList":
      - "question": "Where can I find detailed documentation?"
        "answer": "You can check out our Wiki for detailed guides and comprehensive documentation on every feature and configuration option."
      - "question": "How do I report a bug?"
        "answer": "Found an issue? We'd love to hear about it! Please open an issue on our GitHub repository with detailed reproduction steps so we can get it fixed."
      - "question": "I have a great idea for a new feature. Where can I suggest it?"
        "answer": "We're all ears! You can suggest improvements and new features by creating a feature request issue on our GitHub. Let's build something amazing together!"
      - "question": "Is there a place to discuss the project with the community?"
        "answer": "Absolutely! Join our GitHub Discussions to ask questions, share ideas, and connect with other AIGNE CodeSmith users and contributors."
  - "sectionName": "finalCta"
    "sectionSummary": "This final call-to-action section is designed to convert visitors into users. It presents a clear, compelling message and a prominent button, encouraging them to take the next step and integrate AIGNE CodeSmith into their workflow."
    "ctaTitle": "Ready to Supercharge Your Code Reviews?"
    "ctaDescription": "Stop wasting time on manual reviews and let our AI handle the heavy lifting. Get started today and experience a faster, smarter, and more efficient development workflow."
    "cta":
