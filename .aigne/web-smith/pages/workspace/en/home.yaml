"meta":
  "title": "AIGNE CodeSmith: AI-Powered Code Reviews & PR Summaries"
  "description": "Accelerate your development workflow with AIGNE CodeSmith. Get intelligent, context-aware code reviews and PR summaries powered by Claude's advanced reasoning to improve code quality and save time."
  "image": "mediakit://hero-aigne-codesmith-visual.png"
"sections":
  - "sectionName": "hero"
    "sectionSummary": "This hero section introduces AIGNE CodeSmith with a compelling headline, a brief explanation of its value proposition, and clear calls-to-action to get started. It's designed to grab the visitor's attention and encourage them to explore the product."
    "splitHeroBigTitle": "AI-Powered Code Reviews That Actually Understand Your Code"
    "splitHeroSubTitle": "Accelerate your development workflow with intelligent, context-aware code reviews using Claude's advanced reasoning capabilities."
    "splitHeroDescription": "Transform your code review process. AIGNE CodeSmith doesn't just check syntax—it understands context, identifies architectural issues, and provides thoughtful feedback that helps your team grow."
    "splitHeroActions":
      - "text": "Get Started on GitHub"
        "link": "https://github.com/aigne-io/aigne-codesmith"
      - "text": "Explore Features"
        "link": "#features"
    "splitHeroImage": "mediakit://hero-aigne-codesmith-visual.png"
  - "sectionName": "features"
    "sectionSummary": "This section highlights the core features of AIGNE CodeSmith, showcasing its main capabilities in a visually engaging 3-column grid. Each feature is presented with an icon and a brief description, making it easy for users to quickly grasp the product's benefits."
    "threeColumnGridTitle": "Everything You Need for Smarter Code Reviews"
    "list":
      - "sectionName": "prSummarization"
        "sectionSummary": "Details the PR Summarization feature."
        "iconName": "lucide:file-text"
        "cardTitle": "PR Summarization"
        "cardDescription": "Automatically generates concise summaries and release notes, so you can understand changes at a glance and save precious time."
      - "sectionName": "lineByLineReviews"
        "sectionSummary": "Details the Line-by-Line Reviews feature."
        "iconName": "lucide:search-code"
        "cardTitle": "Line-by-Line Reviews"
        "cardDescription": "Get contextual suggestions for code improvements right where they matter, helping you catch issues before they ever reach production."
      - "sectionName": "costOptimization"
        "sectionSummary": "Details the Cost Optimization feature."
        "iconName": "lucide:dollar-sign"
        "cardTitle": "Cost Optimization"
        "cardDescription": "Incremental reviews track only changed files, minimizing API costs while maximizing your code coverage. It's efficiency built-in!"
      - "sectionName": "smartAnalysis"
        "sectionSummary": "Details the Smart Analysis feature."
        "iconName": "lucide:brain-circuit"
        "cardTitle": "Smart Analysis"
        "cardDescription": "Leverages the power of Claude-3.5-Sonnet for superior reasoning, giving you deep architectural insights, not just simple syntax checks."
      - "sectionName": "intelligentSkipping"
        "sectionSummary": "Details the Intelligent Skipping feature."
        "iconName": "lucide:fast-forward"
        "cardTitle": "Intelligent Skipping"
        "cardDescription": "Our AI is smart enough to ignore trivial changes like typos and formatting, keeping your reviewers focused on what truly matters."
      - "sectionName": "customPrompts"
        "sectionSummary": "Details the Custom Prompts feature."
        "iconName": "lucide:settings-2"
        "cardTitle": "Custom Prompts"
        "cardDescription": "Fully customizable review criteria and tone. Adapt the AI to your team's unique standards and practices effortlessly."
  - "sectionName": "quickStart"
    "sectionSummary": "This section provides a simple, step-by-step guide to get started with AIGNE CodeSmith. It breaks down the process into three easy actions, complete with code snippets and visuals to ensure a frictionless setup experience."
    "oneColumnGridTitle": "Get Up and Running in Under 2 Minutes"
    "list":
      - "sectionName": "addWorkflow"
        "sectionSummary": "First step of the Quick Start guide adding the GitHub workflow file."
        "contentCardTitle": "Step 1: Add the Workflow"
        "contentCardDescription": "Just add one file to your repository! Create a new file at `.github/workflows/aigne-codesmith.yml` and paste in the following configuration. It’s that simple!"
        "contentCardRightCode":
          "name": "aigne-codesmith.yml"
          "content": "name: 🤖 AI Code Review


            permissions:

            \  contents: read

            \  pull-requests: write


            on:

            \  pull_request:

            \  pull_request_review_comment:

            \    types: [created]


            concurrency:

            \  group:

            \    ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}-${{ github.event_name == 'pull_request_review_comment' && 'pr_comment' || 'pr' }}

            \  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}


            jobs:

            \  review:

            \    runs-on: ubuntu-latest

            \    steps:

            \      - uses: aigne-io/aigne-codesmith@latest

            \        env:

            \          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            \          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

            \        with:

            \          debug: false

            \          review_simple_changes: false

            \          review_comment_lgtm: false"
      - "sectionName": "configureSecrets"
        "sectionSummary": "Second step of the Quick Start guide configuring the API key secret in GitHub."
        "contentCardTitle": "Step 2: Configure Secrets"
        "contentCardDescription": "Time to secure your API key. Head over to your repository's Settings > Secrets and variables > Actions. Click 'New repository secret', name it `ANTHROPIC_API_KEY`, and paste your key from the Anthropic Console."
        "contentCardLeftScreenShot": "mediakit://github-action-secret.png"
        "screenShotBackground": "linear-gradient(120deg, rgba(96,89,171,1) 0%, rgba(130,125,190,1) 100%)"
      - "sectionName": "startReviewing"
        "sectionSummary": "Final step of the Quick Start guide confirmation that the setup is complete."
        "contentCardTitle": "Step 3: You're All Set! 🎉"
        "contentCardDescription": "And that's it! Open a new pull request and watch the magic happen. AIGNE CodeSmith will automatically jump in to provide intelligent, helpful reviews. Happy coding!"
        "contentCardRightScreenShot": "mediakit://pr-review-comment.png"
        "screenShotBackground": "linear-gradient(120deg, rgba(95,116,118,1) 0%, rgba(131,158,153,1) 100%)"
  - "sectionName": "useCases"
    "sectionSummary": "This section showcases the versatility of AIGNE CodeSmith by presenting its benefits for different types of teams—Enterprises, Startups, and Open Source projects. It helps potential users visualize how the tool can fit into their specific workflow."
    "threeColumnGridTitle": "Powerful for Teams of Any Scale"
    "list":
      - "sectionName": "enterpriseTeams"
        "sectionSummary": "Use case for enterprise teams."
        "iconName": "lucide:building"
        "cardTitle": "Enterprise Teams"
        "cardDescription": "Maintain consistent standards across large codebases, catch security vulnerabilities early, and provide architectural guidance to keep your projects robust and secure."
      - "sectionName": "startups"
        "sectionSummary": "Use case for startups and small teams."
        "iconName": "lucide:rocket"
        "cardTitle": "Startups & Small Teams"
        "cardDescription": "Uphold high code quality without dedicated reviewers, share knowledge through AI suggestions, and save time to focus on what you do best: building amazing features."
      - "sectionName": "openSource"
        "sectionSummary": "Use case for open source projects."
        "iconName": "lucide:users"
        "cardTitle": "Open Source Projects"
        "cardDescription": "Guide new contributors, ensure consistent review quality across the board, and even auto-generate release notes to keep your community informed and engaged."
