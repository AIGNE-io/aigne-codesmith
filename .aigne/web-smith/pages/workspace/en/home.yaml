meta:
  title: "AIGNE CodeSmith: AI-Powered Code Reviews & PR Summaries"
  description: "Accelerate your development workflow with AIGNE CodeSmith. Get intelligent, context-aware code reviews and automated PR summaries powered by Claude's advanced AI to improve code quality and save time."
  image: "mediakit://aigne-codesmith-hero-visual.png"
sections:
  - sectionName: "hero"
    sectionSummary: "An engaging hero section designed to immediately capture visitor attention with a strong value proposition, compelling visuals, and clear calls-to-action to drive initial engagement."
    splitHeroTitle: "AI-Powered Code Reviews That Actually Understand Your Code"
    splitHeroDescription: "Stop just checking syntax. AIGNE CodeSmith leverages Claude's advanced reasoning to provide deep, context-aware feedback, helping you ship better code, faster. Get intelligent PR summaries and line-by-line reviews right in GitHub."
    splitHeroActions:
      - text: "Get Started Now"
        link: "https://github.com/aigne-io/aigne-codesmith"
      - text: "Read the Docs"
        link: "https://github.com/aigne-io/aigne-codesmith/wiki"
    splitHeroRightImage: "mediakit://aigne-codesmith-hero-visual.png"
  - sectionName: "keyFeatures"
    sectionSummary: "Highlights the core differentiators of AIGNE CodeSmith in a scannable grid format. This section's purpose is to quickly communicate what makes the product special and valuable."
    threeColumnGridTitle: "Why AIGNE CodeSmith is a Game-Changer"
    list:
      - sectionName: "contextAwareReviews"
        sectionSummary: "Feature highlight for Context-Aware Reviews."
        iconName: "lucide:brain-circuit"
        cardTitle: "Context-Aware Reviews"
        cardDescription: "Leverages Claude's superior reasoning to understand the intent and architecture behind your code, providing feedback that goes beyond simple syntax."
      - sectionName: "dualModelEfficiency"
        sectionSummary: "Feature highlight for Dual-Model Efficiency."
        iconName: "lucide:zap"
        cardTitle: "Dual-Model Efficiency"
        cardDescription: "Smartly optimizes costs by using lightweight models for quick summaries and powerful models for deep, line-by-line analysis."
      - sectionName: "focusOnImpact"
        sectionSummary: "Feature highlight for focusing on important changes."
        iconName: "lucide:filter"
        cardTitle: "Focus on What Matters"
        cardDescription: "Automatically skips trivial changes like typos and formatting, so your team can focus on the critical issues that truly impact code quality."
  - sectionName: "coreCapabilities"
    sectionSummary: "Visually demonstrates the main features of the product using a combination of text and actual product screenshots, making the benefits tangible and easy to understand."
    twoColumnGridTitle: "Everything You Need to Supercharge Your Workflow"
    list:
      - sectionName: "prSummarization"
        sectionSummary: "Showcases the PR Summarization feature with a relevant image."
        contentCardTitle: "Automated PR Summaries & Release Notes"
        contentCardDescription: "Save tons of time! Get concise, auto-generated summaries of every pull request. Understand complex changes at a glance and generate release notes effortlessly."
        contentCardRightImage: "mediakit://pr-summary.png"
      - sectionName: "lineByLineReviews"
        sectionSummary: "Showcases the Line-by-Line Reviews feature with a relevant image."
        contentCardTitle: "Intelligent Line-by-Line Reviews"
        contentCardDescription: "Receive contextual suggestions for improvements right where you need them. Catch potential bugs, security issues, and architectural problems before they ever hit production."
        contentCardRightImage: "mediakit://pr-review-comment.png"
      - sectionName: "costOptimization"
        sectionSummary: "Showcases the Cost Optimization feature with a relevant image."
        contentCardTitle: "Smart Cost Optimization"
        contentCardDescription: "Keep your costs low without sacrificing quality. Our incremental reviews only analyze changed files, maximizing your coverage while minimizing API usage."
        contentCardRightImage: "mediakit://pr-title-suggestion.png"
      - sectionName: "customPrompts"
        sectionSummary: "Showcases the Custom Prompts feature with a relevant image."
        contentCardTitle: "Fully Customizable to Your Standards"
        contentCardDescription: "Make it yours! Tailor the review criteria, tone, and focus areas with custom prompts to ensure the AI's feedback perfectly aligns with your team's unique practices."
        contentCardRightImage: "mediakit://pr-walkthrough.png"
  - sectionName: "quickStartGuide"
    sectionSummary: "Provides a simple, step-by-step guide to get users started with the product quickly. This section is designed to be highly actionable and remove any friction to adoption."
    oneColumnGridTitle: "Get Started in Under 2 Minutes"
    list:
      - sectionName: "stepOneWorkflow"
        sectionSummary: "First step of the quick start guide: adding the GitHub workflow file."
        contentCardTitle: "Step 1: Add the Workflow File"
        contentCardDescription: "Just drop this YAML file into your repository at `.github/workflows/aigne-codesmith.yml`. It's all you need to kick things off!"
        contentCardBottomCode:
          name: "aigne-codesmith.yml"
          content: "name: 🤖 AI Code Review\n\npermissions:\n  contents: read\n  pull-requests: write\n\non:\n  pull_request:\n  pull_request_review_comment:\n    types: [created]\n\njobs:\n  review:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: aigne-io/aigne-codesmith@latest\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}"
      - sectionName: "stepTwoSecrets"
        sectionSummary: "Second step of the quick start guide: configuring API secrets."
        contentCardTitle: "Step 2: Add Your Anthropic API Key"
        contentCardDescription: "Head over to your repository's Settings > Secrets and variables > Actions, and add your Anthropic API key as `ANTHROPIC_API_KEY`."
        contentCardBottomImage: "mediakit://github-action-secret.png"
      - sectionName: "stepThreeDone"
        sectionSummary: "Final step of the quick start guide: celebrating completion."
        iconName: "lucide:party-popper"
        cardTitle: "Step 3: You're All Set! 🎉"
        cardDescription: "That's it! Open your next pull request and watch the magic happen. AIGNE CodeSmith will automatically jump in to provide intelligent reviews."
  - sectionName: "useCases"
    sectionSummary: "Demonstrates the product's versatility by showcasing its benefits for different types of teams, from large enterprises to open-source projects, building broader appeal."
    threeColumnGridTitle: "Perfect for Teams of All Shapes and Sizes"
    list:
      - sectionName: "enterpriseTeams"
        sectionSummary: "Use case for enterprise teams."
        iconName: "lucide:building-2"
        cardTitle: "Enterprise Teams"
        cardDescription: "Maintain consistent standards, perform security reviews, and provide architectural guidance across massive codebases with ease."
      - sectionName: "startups"
        sectionSummary: "Use case for startups."
        iconName: "lucide:rocket"
        cardTitle: "Startups & Small Teams"
        cardDescription: "Move fast without breaking things. Maintain high code quality, save precious time, and get instant feedback 24/7."
      - sectionName: "openSource"
        sectionSummary: "Use case for open source projects."
        iconName: "lucide:github"
        cardTitle: "Open Source Projects"
        cardDescription: "Guide new contributors, ensure consistent quality across a diverse community, and auto-generate release notes to keep everyone in the loop."
  - sectionName: "testimonials"
    sectionSummary: "Builds trust and credibility through social proof, featuring real-world testimonials from satisfied users that highlight tangible benefits and successes."
    twoColumnGridTitle: "What Developers Are Saying"
    list:
      - sectionName: "testimonialOne"
        sectionSummary: "First user testimonial."
        userReview:
          content: "AIGNE CodeSmith caught 3 critical security issues in our authentication system that we missed in manual reviews. The architectural suggestions helped us improve our code structure significantly."
          userName: "Sarah Chen"
          description: "Lead Developer at TechFlow"
          avatarImage: ""
      - sectionName: "testimonialTwo"
        sectionSummary: "Second user testimonial."
        userReview:
          content: "We reduced our code review time by 60% while actually improving code quality. The AI provides context that junior developers found incredibly valuable."
          userName: "Marcus Rodriguez"
          description: "Engineering Manager at DataSync"
          avatarImage: ""
  - sectionName: "pricing"
    sectionSummary: "Provides transparent and easy-to-understand pricing information. This section helps potential customers quickly assess the cost and value proposition for their team size."
    threeColumnGridTitle: "Transparent and Simple Pricing"
    list:
      - sectionName: "pricingTierSmall"
        sectionSummary: "Pricing for small teams."
        metricCardTitle: "5 developers"
        metricCardData: "$3-5 / day"
        metricCardDescription: "Based on ~20 PRs daily"
      - sectionName: "pricingTierMedium"
        sectionSummary: "Pricing for medium teams."
        metricCardTitle: "20 developers"
        metricCardData: "$12-20 / day"
        metricCardDescription: "Based on ~80 PRs daily"
      - sectionName: "pricingTierLarge"
        sectionSummary: "Pricing for large teams."
        metricCardTitle: "50+ developers"
        metricCardData: "$30-50 / day"
        metricCardDescription: "Based on ~200 PRs daily"
  - sectionName: "configurationOptions"
    sectionSummary: "Details the customization and configuration options available, demonstrating the product's flexibility and empowering users to tailor it to their specific needs."
    oneColumnGridTitle: "Powerful Configuration at Your Fingertips"
    list:
      - sectionName: "securityFocusedReview"
        sectionSummary: "Example of a security-focused custom prompt."
        contentCardTitle: "Customize for Security-Focused Reviews"
        contentCardDescription: "Direct the AI to prioritize security vulnerabilities. Tailor the system message to focus on authentication, input validation, SQL injection, and more to harden your code."
        contentCardBottomCode:
          name: "system_message"
          content: "system_message: |\n  You are a security-focused code reviewer. Prioritize identifying:\n  - Authentication and authorization flaws\n  - Input validation issues\n  - SQL injection vulnerabilities\n  - XSS prevention\n  - Data exposure risks\n  - Cryptographic best practices"
      - sectionName: "architecturePerformanceReview"
        sectionSummary: "Example of an architecture and performance-focused custom prompt."
        contentCardTitle: "Focus on Architecture & Performance"
        contentCardDescription: "Need high-level feedback? Configure the AI to act as an architectural reviewer, focusing on design patterns, performance bottlenecks, scalability, and SOLID principles."
        contentCardBottomCode:
          name: "system_message"
          content: "system_message: |\n  You are an architectural reviewer focusing on:\n  - System design patterns\n  - Performance bottlenecks\n  - Scalability concerns\n  - Code maintainability\n  - SOLID principles\n  - Database optimization"
  - sectionName: "faq"
    sectionSummary: "Addresses common questions about contributing, support, and getting started. This FAQ section aims to proactively resolve user queries and encourage community engagement."
    faqTitle: "Frequently Asked Questions"
    faqList:
      - question: "How can I contribute to AIGNE CodeSmith?"
        answer: "We love contributions! You can fork the repo, make your changes, and submit a pull request. Check out our contribution guidelines for details on code style and tests. We welcome bug fixes, new features, and documentation improvements."
      - question: "Where can I find more detailed documentation?"
        answer: "For in-depth guides and advanced configuration options, please check out the project's official GitHub Wiki. It's the best place for detailed information."
      - question: "What if I find a bug or have a feature idea?"
        answer: "We'd love to hear from you! Please open an issue on our GitHub repository. Use the 'Bug Report' template for bugs and the 'Feature Request' template for new ideas. This helps us track and address them effectively."
      - question: "How do I get support if I run into a problem?"
        answer: "The best way to get help is to start a conversation in our GitHub Discussions. The community and our team are active there and can help you troubleshoot any issues."
      - question: "Can I use a different AI model besides Claude 3.5 Sonnet?"
        answer: "Yes, AIGNE CodeSmith is flexible! You can configure the `anthropic_light_model` and `anthropic_heavy_model` parameters in your workflow file to use other compatible models from Anthropic."
  - sectionName: "finalCta"
    sectionSummary: "A final, high-impact call-to-action section designed to convert visitors. It restates the core benefit and provides a clear, unmissable button to get started."
    ctaTitle: "Ready to Revolutionize Your Code Reviews?"
    ctaDescription: "Stop wasting time on manual reviews and start leveraging the power of AI. Improve your code quality, accelerate your development cycle, and empower your team today."
    cta:
      - text: "Try AIGNE CodeSmith Now"
        link: "https://github.com/aigne-io/aigne-codesmith"
      - text: ""
        link: ""
