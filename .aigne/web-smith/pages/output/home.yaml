          value:
            - title: 我如何为 AIGNE CodeSmith 做出贡献？
              answer: 我们欢迎任何贡献！您可以 fork
                仓库，进行更改，然后提交拉取请求。请查看我们的贡献指南，了解有关代码风格和测试的详细信息。我们欢迎错误修复、新功能和文档改进。
            - title: 我在哪里可以找到更详细的文档？
              answer: 有关深入指南和高级配置选项，请查看该项目的官方 GitHub Wiki。那里是获取详细信息的最佳位置。
            - title: 如果我发现一个 bug 或有一个功能想法怎么办？
              answer: 我们很乐意听取您的意见！请在我们的 GitHub 仓库中开启一个 issue。对于 bug，请使用“Bug
                Report”模板；对于新想法，请使用“Feature Request”模板。这有助于我们有效地跟踪和处理它们。
            - title: 如果遇到问题，我该如何获得支持？
              answer: 获得帮助的最佳方式是在我们的 GitHub Discussions 中发起一个对话。社区和我们的团队在那里都很活跃，可以帮助您解决任何问题。
            - title: 除了 Claude 3.5 Sonnet，我可以使用其他 AI 模型吗？
              answer: 是的，AIGNE CodeSmith 非常灵活！您可以在工作流文件中配置 `anthropic_light_model` 和
                `anthropic_heavy_model` 参数，以使用 Anthropic 提供的其他兼容模型。
