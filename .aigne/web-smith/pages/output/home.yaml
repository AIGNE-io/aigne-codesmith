            - title: How can I contribute to AIGNE CodeSmith?
              answer: We love contributions! You can fork the repo, make your changes, and
                submit a pull request. Check out our contribution guidelines for
                details on code style and tests. We welcome bug fixes, new
                features, and documentation improvements.
            - title: Where can I find more detailed documentation?
              answer: For in-depth guides and advanced configuration options, please check out
                the project's official GitHub Wiki. It's the best place for
                detailed information.
            - title: What if I find a bug or have a feature idea?
              answer: We'd love to hear from you! Please open an issue on our GitHub
                repository. Use the 'Bug Report' template for bugs and the
                'Feature Request' template for new ideas. This helps us track
                and address them effectively.
            - title: How do I get support if I run into a problem?
              answer: The best way to get help is to start a conversation in our GitHub
                Discussions. The community and our team are active there and can
                help you troubleshoot any issues.
            - title: Can I use a different AI model besides Claude 3.5 Sonnet?
              answer: Yes, AIGNE CodeSmith is flexible! You can configure the
                `anthropic_light_model` and `anthropic_heavy_model` parameters
                in your workflow file to use other compatible models from
                Anthropic.
            - title: ""
              answer: ""
