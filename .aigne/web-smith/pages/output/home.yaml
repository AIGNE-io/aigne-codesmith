  7303e9b086f8fd03:
    en:
      properties:
        a7frn5jmx5vpxpt3:
          value: >-
            name: 🤖 AI Code Review


            permissions:
              contents: read
              pull-requests: write

            on:
              pull_request:
              pull_request_review_comment:
                types: [created]

            concurrency:
              group:
                ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}-${{ github.event_name == 'pull_request_review_comment' && 'pr_comment' || 'pr' }}
              cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}

            jobs:
              review:
                runs-on: ubuntu-latest
                steps:
                  - uses: aigne-io/aigne-codesmith@latest
                    env:
                      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                    with:
                      debug: false
                      review_simple_changes: false
                      review_comment_lgtm: false
        b2jrz12ik7esf93z:
          value: aigne-codesmith.yml
        d8hvf7cxz93jk5p:
          value: 1rem
        qvxiyadgn5bj6oq8:
          value: false
