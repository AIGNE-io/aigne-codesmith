            - title: Where can I find detailed documentation?
              answer: You can check out our Wiki for detailed guides and comprehensive
                documentation on every feature and configuration option.
            - title: How do I report a bug?
              answer: Found an issue? We'd love to hear about it! Please open an issue on our
                GitHub repository with detailed reproduction steps so we can get
                it fixed.
            - title: I have a great idea for a new feature. Where can I suggest it?
              answer: We're all ears! You can suggest improvements and new features by
                creating a feature request issue on our GitHub. Let's build
                something amazing together!
            - title: Is there a place to discuss the project with the community?
              answer: Absolutely! Join our GitHub Discussions to ask questions, share ideas,
                and connect with other AIGNE CodeSmith users and contributors.
